# Test environment override
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
# Creates isolated test DB and Redis on different ports

services:
  postgres:
    container_name: viraedit-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: viraedit_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    container_name: viraedit-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data

  minio:
    container_name: viraedit-minio-test
    environment:
      MINIO_ROOT_USER: testadmin
      MINIO_ROOT_PASSWORD: testadmin123
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_test_data:/data

  minio-init:
    environment:
      MINIO_USER: testadmin
      MINIO_PASSWORD: testadmin123
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 testadmin testadmin123 &&
        mc mb --ignore-existing local/viraedit-test &&
        exit 0
      "

volumes:
  postgres_test_data:
  redis_test_data:
  minio_test_data:
