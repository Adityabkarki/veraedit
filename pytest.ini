[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Fast unit tests (no external services)
    integration: Integration tests (require Docker services)
    e2e: End-to-end tests (require full stack)
    nepali: Tests specific to Nepali language handling
    windows: Tests specific to Windows path handling
    slow: Tests that take > 5 seconds
